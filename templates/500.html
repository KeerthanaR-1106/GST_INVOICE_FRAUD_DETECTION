{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}

<div class="d-flex flex-column align-items-center justify-content-center text-center"
     style="min-height: 65vh;">

  <!-- Large 500 display -->
  <div class="display-1 fw-bold text-danger mb-0" style="font-size: 8rem; opacity: 0.12;">
    500
  </div>

  <div class="mt-n4 mb-3">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
  </div>

  <h1 class="fw-bold mb-2">500 &ndash; Internal Server Error</h1>

  <div class="d-flex gap-3 flex-wrap justify-content-center">
    <a href="/" class="btn btn-primary btn-lg px-4">
      <i class="bi bi-house-door-fill me-2"></i>Back to Dashboard
    </a>
    <button onclick="window.location.reload();" class="btn btn-outline-danger btn-lg px-4">
      <i class="bi bi-arrow-clockwise me-2"></i>Try Again
    </button>
  </div>

</div>

<script>
  // Inject current timestamp for support reference (no hardcoding)
  document.getElementById('err-timestamp').textContent = new Date().toISOString();
</script>

{% endblock %}
