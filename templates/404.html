{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}

<div class="d-flex flex-column align-items-center justify-content-center text-center"
     style="min-height: 65vh;">

  <!-- Large 404 display -->
  <div class="display-1 fw-bold text-secondary mb-0" style="font-size: 8rem; opacity: 0.15;">
    404
  </div>

  <div class="mt-n4 mb-3">
    <i class="bi bi-file-earmark-x text-muted" style="font-size: 4rem;"></i>
  </div>

  <h1 class="fw-bold mb-2">404 &ndash; Page Not Found</h1>

  <div class="d-flex gap-3 flex-wrap justify-content-center">

    <a href="/invoices" class="btn btn-outline-secondary btn-lg px-4">

</div>

{% endblock %}
